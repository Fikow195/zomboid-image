name: Build and publish container image

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Optional additional image tag
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fikow195/zomboid
  TEST_IMAGE: elysiumup-zomboid:test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run source contract tests
        run: bash tests/rebrand.test.sh

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify inherited runtime contract
        run: bash scripts/verify-image.sh "${TEST_IMAGE}"

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=sha
          labels: |
            org.opencontainers.image.title=ElysiumUp Project Zomboid
            org.opencontainers.image.vendor=ElysiumUp
            org.opencontainers.image.description=Optimized Project Zomboid dedicated server image for ElysiumUp Hosting
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.base.name=ghcr.io/pterohost/pterodactyl-images:zomboid
            org.opencontainers.image.base.digest=sha256:db80db6b9b7dde16d2d525aff207eac78e9b18f8e145661f5079d4582bc028f8

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
